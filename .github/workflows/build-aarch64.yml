# Builds the riban LV2 plugins for aarch64 (arm64) on a native GitHub arm64 runner, inside a Debian Trixie container
name: Build aarch64

on:
  push:
    branches: [main]
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build arm64
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie

    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git ca-certificates file

      - name: Checkout (with DPF and pugl submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read package version
        id: version
        run: |
          VERSION=$(sed -n 's/^Version: *//p' riban-lv2/DEBIAN/control)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"
          # ai_comment: On a release tag, make sure the tag matches the deb control version.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Version ${VERSION} in riban-lv2/DEBIAN/control"
            exit 1
          fi

      - name: Build plugins
        run: make -j"$(nproc)"

      - name: Build Debian package
        run: make deb

      - name: Package LV2 bundles as tarball
        run: |
          tar -czf "bin/riban-lv2_${{ steps.version.outputs.version }}_arm64.tar.gz" -C bin/lv2 .
          ls -l bin
          file bin/lv2/*/*.so
          dpkg-deb -I bin/*.deb

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: riban-lv2_${{ steps.version.outputs.version }}_arm64
          path: |
            bin/*.deb
            bin/*.tar.gz
          if-no-files-found: error

      - name: Publish release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.deb
            bin/*.tar.gz
          generate_release_notes: true
