# ai_comment: Builds the riban LV2 plugins for aarch64 (arm64) on a native GitHub
# ai_comment: arm64 runner, inside a Debian Trixie container so the binaries link
# ai_comment: against the same glibc as Zynthian Vangelis (Raspberry Pi OS Trixie).
name: Build aarch64

on:
  push:
    branches: [main]
    # ai_comment: Release tags in this repo are bare versions, e.g. 1.3.1
    tags: ['[0-9]+.[0-9]+.[0-9]+*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # ai_comment: needed to create releases and upload assets

jobs:
  build:
    name: Build arm64
    # ai_comment: Native arm64 runner (free for public repositories) - no cross-compiling or QEMU.
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:trixie

    steps:
      # ai_comment: git must exist in the container before checkout, otherwise
      # ai_comment: actions/checkout falls back to a tarball download without submodules.
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential pkg-config git ca-certificates file

      - name: Checkout (with DPF and pugl submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Read package version
        id: version
        run: |
          VERSION=$(sed -n 's/^Version: *//p' riban-lv2/DEBIAN/control)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"
          # ai_comment: On a release tag, make sure the tag matches the deb control version.
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "$VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Version ${VERSION} in riban-lv2/DEBIAN/control"
            exit 1
          fi

      - name: Build plugins
        run: make -j"$(nproc)"

      - name: Build Debian package
        run: make deb

      - name: Package LV2 bundles as tarball
        run: |
          tar -czf "bin/riban-lv2_${{ steps.version.outputs.version }}_arm64.tar.gz" -C bin/lv2 .
          ls -l bin
          file bin/lv2/*/*.so
          dpkg-deb -I bin/*.deb

      # ai_comment: Every run (push, PR, manual) keeps the build as a workflow artifact.
      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: riban-lv2_${{ steps.version.outputs.version }}_arm64
          path: |
            bin/*.deb
            bin/*.tar.gz
          if-no-files-found: error

      # ai_comment: Pushing a version tag also publishes a GitHub Release with the files attached.
      - name: Publish release assets
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bin/*.deb
            bin/*.tar.gz
          generate_release_notes: true
